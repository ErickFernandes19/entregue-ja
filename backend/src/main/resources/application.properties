
spring.application.name=backend


google.routes.api-key=${GOOGLE_ROUTES_API_KEY}


spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/entregue_ja}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}


spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}


server.address=0.0.0.0
server.port=${PORT:8080}


spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true


cloudflare.r2.account-id=${R2_ACCOUNT_ID}
cloudflare.r2.access-key=${R2_ACCESS_KEY_ID}
cloudflare.r2.secret-key=${R2_SECRET_ACCESS_KEY}
cloudflare.r2.bucket=${R2_BUCKET_NAME:entregueja-arquivos}


jwt.secret=${JWT_SECRET}
